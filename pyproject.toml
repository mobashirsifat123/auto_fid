[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provider-first-autoresearch"
version = "0.1.0a1"
description = "AutoResearch evidence-first research discovery and review platform"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28,<1",
  "pypdf>=6.0,<7",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
autoresearch = "autoresearch.cli.app:main"
autoresearch-api = "autoresearch.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoresearch = ["skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
