name: AutoResearch CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]" anyio
      - name: Offline five-skill smoke (deterministic fixtures, no network)
        run: python -m pytest tests/ -q
      - name: Compile and dependency checks
        run: python -m compileall -q src && python -m pip check
