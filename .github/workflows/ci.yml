name: AutoResearch backend CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test backend
        run: python -m pytest -q
      - name: Compile and dependency checks
        run: python -m compileall -q src && python -m pip check
      - name: Offline ResearchBench release gate
        run: python scripts/run_researchbench.py --strict --skip-cli --output /tmp/researchbench.json
      - name: Backend release packaging smoke test
        run: python scripts/build_release.py --skip-tui --output /tmp/autoresearch-release
